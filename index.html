  <script>
    /* Telegram ichida ochilganini birinchi kadrdan oldin aniqlaymiz */
    (function () {
      var inTg = /tgWebApp(Data|Platform|Version)=/.test(location.hash);
      try { if (!inTg && sessionStorage.getItem('__telegram__initParams')) inTg = true; } catch (e) {}
      if (inTg) document.documentElement.classList.add('is-tg');
    })();
  </script>
</head>

  <div id="app">
    <noscript><div class="noscript">FilasofTV ishlashi uchun brauzeringizda JavaScript yoqilgan boʻlishi kerak.</div></noscript>
